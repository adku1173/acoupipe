name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exclude Windows - Ray 2.54.1 has no Python 3.13 Windows wheel
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@v4
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: uv sync --frozen --group test
      
      - name: Run tests
        run: uv run --frozen pytest -v --durations=10 tests

  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exclude Windows - Ray 2.54.1 has no Python 3.13 Windows wheel
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@v4
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install package
        run: uv sync --frozen --no-dev --exact
      
      - name: Test import
        run: uv run --frozen --no-dev --exact python -c "import acoupipe; print(f'AcouPipe version: {acoupipe.__version__}')"
