src = ["src"]
exclude = ["docs/source", ".git"]
line-length = 120

[lint]
select = [
        "F", # pyflakes
        "C", "E", "R", "W",  # pylint (including pycodestyle)
        "C90", "I", "N", "D", "UP",
        "YTT", "ASYNC", "ASYNC1", "BLE", "B", "A", "COM", # flake8 plugins
        "C4", "DTZ", "T10", "EM", "FA", "ISC", "ICN", # flake8 plugins
        "LOG", "G", "INP", "PIE", "T20", "PYI", "PT", "RSE", # flake8 plugins
        "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "TD", # flake8 plugins
        "C901" # others
        ]

ignore = [ #69-71
    # temporary guards
    "W505", #ISSUE 60, 62 - 66 (list 3-8)
    "ICN001", #ISSUE 58 (list 2)
    "ICN003", #ISSUE 58 (list 2)
    # AcouPipe-specific ignores
    "E501",   #ISSUE 60, 62 - 66 (list 3-8)
    "G004",   #ISSUE 68 (list 11)
    "LOG015", #ISSUE 68 (list 11)
    # Mirrors Acoular ignores
    "C901",   # do we want to measure code complexity -> TBD
    "COM812", # conflict with ruff formatter
    "ISC001", # conflict with ruff formatter
    "D401",   # first line should be in imperative mood -> TBD
    "T20",    # will be fixed when logging is implemented
    "SLF001", # private member access -> TBD
]

[lint.flake8-import-conventions]
banned-from  = ["numba", "numpy", "scipy.linalg"]
[lint.flake8-import-conventions.aliases]
acoular = "ac"
numba = "nb"
numpy = "np"
"scipy.linalg" = "spla"
"matplotlib.pyplot" = "plt"

[lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 100

[lint.pydocstyle]
convention = "numpy"

[format]
quote-style = "single"
docstring-code-format = true
#ISSUE 60, 62 - 66 (list 3-8): Acoular uses 120, kept "dynamic" to for passes to check,
docstring-code-line-length = "dynamic" 

[lint.per-file-ignores]
"src/*" = ["D", "N806", "N802", "C901", "SLF001", "ARG004", "ARG002", "ARG001"] # PR 61, 67 (list 9 - 10)
"examples/*" = ["D", "INP001", "ARG"] # ISSUE 71 (list 14)
"app/main.py" = ["A002", "D103", "DTZ005", "D100", "INP001"] # ISSUE 70 (list 13)
"tests/*" = ["ALL"] #ISSUE 69 (list 12)
